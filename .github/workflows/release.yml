name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK_VERSION: '25.1.8937393'
  APK_BASENAME: keenon-uvc-multi-probe

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package is gone from the SDK repository; the next step installs the rest.
          packages: 'platform-tools'

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Create local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "ndk.dir=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          } > local.properties

      - name: Resolve app version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"
          else
            echo "APP_VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"
          fi
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        id: artifact
        run: |
          mkdir -p release
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_SUFFIX="${GITHUB_REF_NAME}"
          else
            VERSION_SUFFIX="manual-${GITHUB_RUN_NUMBER}"
          fi
          APK_FILE="release/${APK_BASENAME}-${VERSION_SUFFIX}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_FILE}"
          echo "apk_file=${APK_FILE}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=$(basename "${APK_FILE}")" >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        run: |
          cat > release/RELEASE_NOTES.md <<EOF
          ## 安装前注意
          - 本版沿用原有 debug 签名构建流程，不保证可覆盖旧版；此前已确认官方 beta.5 与 beta.4 签名不同
          - 安装前核对签名或确认旧版签名密钥是否保留；不要直接卸载旧 App 绕过失败，以免丢失推流配置并中断现场推流

          ## 更新内容
          - 修复相机尚未打开成功就收到失败或断开回调时，回调设备对象未关闭的问题
          - 列表变化时先关闭所有被替换的旧连接，再申请新连接；同一 cameraId 等待旧连接关闭确认，避免应用内部重复打开
          - 按 cameraId 独立退避重试，间隔从 1.5 秒递增至最多 30 秒；其他相机通知或重复启动请求不再绕过等待
          - 修复扫描异常后失去恢复机会、停止时过早结束回调线程等问题；旧回调不影响新连接
          - 日志增加失败阶段、cameraId、尝试序号、异常原因和重试间隔，枚举变化时记录完整 ID 列表
          - 保留官方 640x480、单 SurfaceTexture、TEMPLATE_PREVIEW 和原 KJPG 协议，正常路不重复打开
          - 包含 beta.5 的只读 GET /logs，读取现有最近最多 220 行服务内存日志；旧 USB/UVC 模式无日志源时返回 503

          ## 验证与访问
          - 本地 :app:lintDebug 和 :app:assembleDebug 已通过；Lint 为 0 错误、15 个警告
          - 生产恢复策略的 89 项主机断言通过，原有 HTTP 日志、快照和流接口的 49 项检查通过
          - 主机检查不执行真实 Handler、CameraManager 或 EGL；独立代码复查通过，修复效果仍需机器人验证
          - 解决安装兼容性后，启动服务并保存日志：http://192.168.3.251:8080/logs
          - 摄像头状态对照入口：http://192.168.3.251:8080/cameras

          ## 预发布说明
          - 本版修复已确认的应用缺陷，不代表已证明现场四路失败的唯一原因；没有安装或重启机器人
          - 不能强行抢占其他 App 的摄像头；若 HAL 永远不返回打开或关闭回调，对应 ID 会保持等待，停止时也可能保留回调线程
          - 路号仍按枚举顺序排列，不代表稳定物理摄像头身份
          - 接口无鉴权且使用明文 HTTP，仅限可信网络；能访问端口的客户端即可读取日志，不要暴露到公网
          - 日志仅来自 CameraStreamingService，不是系统或其他 App 日志；服务重建后历史丢失

          ## 安装
          仅适用于首次安装或已确认签名兼容的设备：
          \`\`\`bash
          adb install -r ${{ steps.artifact.outputs.apk_name }}
          \`\`\`
          - 若更新失败，请停止并返回完整错误；版本递增不能绕过签名冲突
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME }}
          path: release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release/RELEASE_NOTES.md
          files: release/*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
