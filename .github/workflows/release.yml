name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK_VERSION: '25.1.8937393'
  APK_BASENAME: keenon-uvc-multi-probe

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package is gone from the SDK repository; the next step installs the rest.
          packages: 'platform-tools'

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Create local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "ndk.dir=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          } > local.properties

      - name: Resolve app version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"
          else
            echo "APP_VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"
          fi
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        id: artifact
        run: |
          mkdir -p release
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_SUFFIX="${GITHUB_REF_NAME}"
          else
            VERSION_SUFFIX="manual-${GITHUB_RUN_NUMBER}"
          fi
          APK_FILE="release/${APK_BASENAME}-${VERSION_SUFFIX}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_FILE}"
          echo "apk_file=${APK_FILE}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=$(basename "${APK_FILE}")" >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        run: |
          cat > release/RELEASE_NOTES.md <<EOF
          ## 更新内容
          - v0.2.0-beta.5 新增只读 GET /logs，复用 Camera2 服务现有的最近最多 220 行带时间戳日志，以 UTF-8 纯文本返回；HTTP 首页提供入口
          - 日志仅保存在内存中，不落盘；读取不清空日志、不记录读取本身，也不触发任何摄像头操作；服务或进程重建后历史丢失
          - 本次不改摄像头采集、重试、槽位映射或 KJPG 协议，现有摄像头列表、快照和 MJPEG 入口保持不变
          - 旧 USB/UVC 模式没有服务日志源，访问 /logs 返回 503 Service Unavailable

          ## 验证与访问
          - 此前本地 :app:lintDebug 和 :app:assembleDebug 已通过，主机侧 HTTP 验证共 49 项断言通过
          - 2026-11-26 在机器人旧已安装版本上观察到四路 OPEN、JPEG 计数增长、四路快照可访问；此证据不代表新 /logs 接口已在机器人验证
          - 安装本版并启动 Camera2 服务后，仍需验证日志入口：http://192.168.3.251:8080/logs
          - 摄像头状态对照入口：http://192.168.3.251:8080/cameras

          ## 预发布说明
          - 这是只读服务日志功能的 Beta，仅辅助现场诊断，不代表已修复摄像头偶发丢失问题
          - 接口无鉴权且使用明文 HTTP，仅限可信网络；能访问端口的客户端即可读取日志，不要暴露到公网
          - 日志仅来自 CameraStreamingService，不是完整 App、Android 系统或其他 App 日志，也无法找回已丢弃的历史

          ## 安装
          \`\`\`bash
          adb install -r ${{ steps.artifact.outputs.apk_name }}
          \`\`\`
          - 沿用既有 debug 签名构建流程，尚未验证与机器人已安装版本的覆盖升级兼容性
          - 若出现签名或版本冲突等更新失败，请停止安装并返回完整错误供评估；未妥善保留现有推流地址等设置前，不要卸载机器人上的旧 App 来绕过失败
          - 安装更新会中断推流，请安排合适的安装窗口；本次发版准备未安装或重启机器人
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME }}
          path: release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Keenon UVC Multi Probe ${{ github.ref_name }}
          body_path: release/RELEASE_NOTES.md
          files: release/*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
